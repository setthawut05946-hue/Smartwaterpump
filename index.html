<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Water Quality Monitor</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f3f8fc;
      color: #17324d;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .connection {
      text-align: center;
      padding: 12px;
      margin-bottom: 20px;
      background: white;
      border-radius: 12px;
      font-weight: bold;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(200px, 1fr)
      );

      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      text-align: center;

      box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      margin: 15px 0;
    }

    .unit {
      font-size: 16px;
      color: #666;
    }

    .status {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 8px;
    }

    .low {
      background: #ffe0e0;
      color: #b00020;
    }

    .normal {
      background: #e0f5e8;
      color: #16723a;
    }

    .high {
      background: #fff0cc;
      color: #9a6200;
    }

    .pump-on {
      background: #dff7e5;
      color: #08752b;
    }

    .pump-off {
      background: #eeeeee;
      color: #555555;
    }

    .auto-card {
      margin-top: 20px;
    }

    .auto-card h2 {
      color: #17324d;
    }

    .rule {
      font-size: 18px;
      margin: 10px 0;
    }

    button {
      border: none;
      border-radius: 10px;

      padding: 12px 20px;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      margin: 5px;
    }

    .btn-on {
      background: #28a745;
      color: white;
    }

    .btn-off {
      background: #dc3545;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .updated {
      margin-top: 20px;
      text-align: center;
      padding: 12px;
      background: white;
      border-radius: 12px;
    }

    .error {
      color: #b00020;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>💧 Water Quality Monitor</h1>


  <!-- Firebase Connection Status -->

  <div
    id="connection"
    class="connection"
  >
    กำลังเชื่อมต่อ Firebase...
  </div>


  <!-- Sensor Cards -->

  <div class="grid">


    <!-- Temperature -->

    <div class="card">

      <h2>🌡️ อุณหภูมิน้ำ</h2>

      <div
        id="temperature"
        class="value"
      >
        --
      </div>

      <div class="unit">
        °C
      </div>

    </div>


    <!-- Water Level -->

    <div class="card">

      <h2>💧 ระดับน้ำ</h2>

      <div
        id="waterLevel"
        class="value"
      >
        --
      </div>

      <div class="unit">
        %
      </div>

      <div
        id="levelStatus"
        class="status"
      >
        --
      </div>

    </div>


    <!-- pH -->

    <div class="card">

      <h2>🧪 ค่า pH</h2>

      <div
        id="ph"
        class="value"
      >
        --
      </div>

      <div
        id="phStatus"
        class="status"
      >
        --
      </div>

    </div>


    <!-- Pump -->

    <div class="card">

      <h2>⚙️ ปั๊มน้ำ</h2>

      <div
        id="pump"
        class="value"
      >
        --
      </div>

      <div
        id="pumpStatus"
        class="status"
      >
        --
      </div>

    </div>

  </div>


  <!-- Auto Pump -->

  <div class="card auto-card">

    <h2>🔄 ระบบควบคุมปั๊มอัตโนมัติ</h2>

    <p class="rule">
      💧 ระดับน้ำ ≤ 30% → 🔴 <b>Pump OFF</b>
    </p>

    <p class="rule">
      💧 ระดับน้ำ &gt; 30% → 🟢 <b>Pump ON</b>
    </p>


    <hr>


    <h3>
      ควบคุมปั๊มด้วยตนเอง
    </h3>

    <button
      class="btn-on"
      onclick="setPump(true)"
    >
      🟢 สั่งเปิดปั๊ม
    </button>

    <button
      class="btn-off"
      onclick="setPump(false)"
    >
      🔴 สั่งปิดปั๊ม
    </button>

  </div>


  <!-- Last Updated -->

  <div class="updated">

    อัปเดตล่าสุด:
    <span id="updated">
      --
    </span>

  </div>

</div>


<!-- Firebase -->

<script type="module">


  // ========================================
  // Firebase Libraries
  // ========================================

  import {
    initializeApp
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getDatabase,
    ref,
    onValue,
    set
  }
  from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


  // ========================================
  // Firebase Configuration
  // ========================================

  const firebaseConfig = {

    apiKey:
      "AIzaSyBg1JRPtAa2E5ah1UJGlHTTn3CJrVPUjIs",

    authDomain:
      "smartwaterpump2.firebaseapp.com",

    databaseURL:
      "https://smartwaterpump2-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
      "smartwaterpump2",

    storageBucket:
      "smartwaterpump2.firebasestorage.app",

    messagingSenderId:
      "118240836212",

    appId:
      "1:118240836212:web:b1a7c7ecd40d2ca7306f21",

    measurementId:
      "G-EKF88BZE3T"

  };


  // ========================================
  // Start Firebase
  // ========================================

  const app =
    initializeApp(firebaseConfig);


  const db =
    getDatabase(app);


  // Firebase Root

  const rootRef =
    ref(db);


  // ========================================
  // Auto Pump Function
  // ========================================

  async function autoPump(
    waterLevel,
    currentPump
  ) {

    // ตรวจสอบค่าระดับน้ำ

    if (
      !Number.isFinite(waterLevel)
    ) {

      console.log(
        "Water Level Error"
      );

      return;
    }


    // ======================================
    // AUTO PUMP LOGIC
    // ======================================

    let desiredPump;


    if (waterLevel <= 30) {

      // ระดับน้ำ <= 30%
      // Pump OFF

      desiredPump = false;

      console.log(
        "Water Level <= 30% → Pump OFF"
      );

    }

    else {

      // ระดับน้ำ > 30%
      // Pump ON

      desiredPump = true;

      console.log(
        "Water Level > 30% → Pump ON"
      );

    }


    // ======================================
    // ตรวจสอบว่าต้องเปลี่ยนสถานะหรือไม่
    // ======================================

    if (
      currentPump === desiredPump
    ) {

      return;

    }


    // ======================================
    // ส่งคำสั่งไป Firebase
    // ======================================

    try {

      await set(
        ref(db, "pump"),
        desiredPump
      );


      await set(
        ref(db, "updated"),
        Date.now()
      );


      console.log(
        "Pump =",
        desiredPump
          ? "ON"
          : "OFF"
      );

    }

    catch (error) {

      console.error(
        "Auto Pump Error:",
        error
      );

    }

  }


  // ========================================
  // Water Level Status
  // ========================================

  function updateLevelStatus(
    level
  ) {

    const element =
      document.getElementById(
        "levelStatus"
      );


    if (level <= 30) {

      element.textContent =
        "LOW";

      element.className =
        "status low";

    }

    else {

      element.textContent =
        "NORMAL";

      element.className =
        "status normal";

    }

  }


  // ========================================
  // pH Status
  // ========================================

  function updatePhStatus(
    ph
  ) {

    const element =
      document.getElementById(
        "phStatus"
      );


    if (ph < 6.5) {

      element.textContent =
        "ACIDIC";

      element.className =
        "status low";

    }

    else if (ph > 8.5) {

      element.textContent =
        "ALKALINE";

      element.className =
        "status high";

    }

    else {

      element.textContent =
        "NORMAL";

      element.className =
        "status normal";

    }

  }


  // ========================================
  // Firebase Real-Time Listener
  // ========================================

  onValue(
    rootRef,

    (snapshot) => {


      const data =
        snapshot.val() || {};


      // ====================================
      // Read Firebase Values
      // ====================================

      const temperature =
        Number(
          data.temperature
        );


      const waterLevel =
        Number(
          data.waterLevel
        );


      const ph =
        Number(
          data.ph
        );


      const pump =
        Boolean(
          data.pump
        );


      // ====================================
      // Temperature Display
      // ====================================

      document.getElementById(
        "temperature"
      ).textContent =

        Number.isFinite(
          temperature
        )

        ? temperature.toFixed(2)

        : "--";


      // ====================================
      // Water Level Display
      // ====================================

      document.getElementById(
        "waterLevel"
      ).textContent =

        Number.isFinite(
          waterLevel
        )

        ? waterLevel.toFixed(0)

        : "--";


      // ====================================
      // pH Display
      // ====================================

      document.getElementById(
        "ph"
      ).textContent =

        Number.isFinite(
          ph
        )

        ? ph.toFixed(2)

        : "--";


      // ====================================
      // Water Level Status
      // ====================================

      if (
        Number.isFinite(
          waterLevel
        )
      ) {

        updateLevelStatus(
          waterLevel
        );

      }


      // ====================================
      // pH Status
      // ====================================

      if (
        Number.isFinite(
          ph
        )
      ) {

        updatePhStatus(
          ph
        );

      }


      // ====================================
      // Pump Display
      // ====================================

      const pumpElement =
        document.getElementById(
          "pump"
        );


      const pumpStatusElement =
        document.getElementById(
          "pumpStatus"
        );


      if (pump) {

        pumpElement.textContent =
          "ON";

        pumpStatusElement.textContent =
          "กำลังทำงาน";

        pumpStatusElement.className =
          "status pump-on";

      }

      else {

        pumpElement.textContent =
          "OFF";

        pumpStatusElement.textContent =
          "หยุดทำงาน";

        pumpStatusElement.className =
          "status pump-off";

      }


      // ====================================
      // Firebase Connection
      // ====================================

      const connection =
        document.getElementById(
          "connection"
        );


      connection.textContent =
        "Firebase เชื่อมต่อแล้ว";


      connection.style.color =
        "#08752b";


      // ====================================
      // Updated Time
      // ====================================

      const updated =
        document.getElementById(
          "updated"
        );


      if (data.updated) {

        updated.textContent =
          new Date(
            data.updated
          ).toLocaleString(
            "th-TH"
          );

      }

      else {

        updated.textContent =
          "--";

      }


      // ====================================
      // AUTO PUMP
      // ====================================

      if (
        Number.isFinite(
          waterLevel
        )
      ) {

        autoPump(
          waterLevel,
          pump
        );

      }

    },


    // ======================================
    // Firebase Error
    // ======================================

    (error) => {

      console.error(
        error
      );


      const connection =
        document.getElementById(
          "connection"
        );


      connection.textContent =
        "Firebase เชื่อมต่อผิดพลาด";


      connection.style.color =
        "#b00020";

    }

  );


  // ========================================
  // Manual Pump Control
  // ========================================

  window.setPump =
    async function(state) {

      try {

        await set(
          ref(db, "pump"),
          state
        );


        await set(
          ref(db, "updated"),
          Date.now()
        );


        console.log(
          "Manual Pump:",
          state
            ? "ON"
            : "OFF"
        );

      }

      catch (error) {

        console.error(
          "Manual Pump Error:",
          error
        );


        alert(
          "ไม่สามารถสั่งปั๊มได้"
        );

      }

    };


</script>

</body>

</html>
